name: Validate MFIERP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check addons tests scripts
  odoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated database password
        run: printf 'MFIERP_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
      - run: docker compose up -d db
      - name: Install and test Odoo 20
        run: docker compose run --rm odoo odoo --database=mfierp_test --init=mfierp --without-demo=True --test-enable --test-tags=/mfierp --stop-after-init --no-http
      - name: Verify upgrade
        run: docker compose run --rm odoo odoo --database=mfierp_test --update=mfierp --test-enable --test-tags=/mfierp --stop-after-init --no-http
      - name: Verify CE optional-app absence and empty-core uninstall
        run: |
          docker compose run --rm -T \
            -e MFIERP_TEST_CORE_LIFECYCLE=UNINSTALL_SYNTHETIC_ONLY \
            -e MFIERP_TEST_CORE_LIFECYCLE_DB=mfierp_test \
            odoo odoo shell --database=mfierp_test --no-http \
            < scripts/verify_core_lifecycle.py
      - if: always()
        run: docker compose down
